repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-format
      - id: ruff
  - repo: local
    hooks:
      - id: validate-pyproject
        name: validate pyproject
        entry: validate-pyproject pyproject.toml
        language: python
        additional_dependencies: [tomli, validate-pyproject]
        files: ^pyproject\.toml$
        pass_filenames: false
