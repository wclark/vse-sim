name: Test VSE

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,publish]"

      - name: Run tests with coverage
        run: |
          python -m pytest --doctest-modules --cov=. --cov-fail-under=100 --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=pytest-results.xml

      - name: Build package distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install package in clean environment
        run: |
          python -m venv /tmp/vse-sim-package
          /tmp/vse-sim-package/bin/python -m pip install --upgrade pip
          /tmp/vse-sim-package/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/vse-sim-package/bin/python - <<'PY'
          from debugDump import setDebug
          from vse import CsvBatch as LegacyCsvBatch
          from voterModels import PolyaModel as LegacyPolyaModel
          from vse_sim import CsvBatch, Mav, PolyaModel, Score, baseRuns, medianRuns

          setDebug(False)
          assert CsvBatch is LegacyCsvBatch
          assert PolyaModel is LegacyPolyaModel
          assert len(CsvBatch(PolyaModel(), [[Score(), baseRuns], [Mav(), medianRuns]], 5, 4, 3).rows) == 60
          print("package import smoke test passed")
          PY

      - name: Write coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Coverage"
              echo
              echo '```text'
              python -m coverage report
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload machine-readable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload package distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-distributions
          path: dist/
          if-no-files-found: ignore
          retention-days: 14
