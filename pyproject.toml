[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vse-sim"
version = "0.1.0"
description = "Voter Satisfaction Efficiency simulation tools for voting systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["elections", "simulation", "voting", "voter satisfaction efficiency"]
authors = [
    { name = "VSE Sim contributors" },
]
dependencies = [
    "numpy",
    "scipy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
lint = [
    "ruff",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
publish = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/wclark/vse-sim"
Documentation = "http://electionscience.github.io/vse-sim/"
Issues = "https://github.com/wclark/vse-sim/issues"
Repository = "https://github.com/wclark/vse-sim"

[tool.setuptools]
packages = ["vse_sim"]
py-modules = [
    "compat",
    "dataClasses",
    "debugDump",
    "methods",
    "mydecorators",
    "sodaTest",
    "stratFunctions",
    "tests",
    "voterModels",
    "vse",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv",
    ".package-smoke",
    "build",
    "docs",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Keep the first enforced pass focused on mechanically safe checks. These legacy
# patterns can be tightened gradually after the simulation code is less coupled to
# wildcard imports and old helper idioms.
ignore = [
    "E402",  # module level import not at top of file
    "E701",  # multiple statements on one line
    "E721",  # direct type comparison
    "E722",  # bare except
    "E731",  # assigned lambda
    "E741",  # ambiguous variable name
    "F403",  # wildcard import
    "F405",  # name may be undefined from wildcard import
    "F841",  # assigned but unused local variable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
filterwarnings = ["error"]
